<!DOCTYPE html>
<!-- republish 2026-10-07 -->
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Jennys cafe | CAST LIST</title>
  <meta name="description" content="Jennys cafeの在籍キャスト一覧ページです。写真提供のある在籍キャストを掲載しています。" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="hero">
      <p class="brand">Jennys cafe</p>
      <p class="eyebrow">CAST LIST</p>

      <h1>在籍キャスト</h1>

      <p class="lead">
        写真提供のある在籍キャストを掲載しています。<br>
        最新の出勤状況については、<a class="contact-link" href="https://lin.ee/w4NzYLd" target="_blank" rel="noopener noreferrer">店舗LINE</a>またはお電話にてご確認ください。
      </p>

      <a class="line-button" href="https://lin.ee/w4NzYLd" target="_blank" rel="noopener noreferrer">
        LINEで出勤状況を確認
      </a>
    </section>

    <section class="cast-section">
      <p class="section-title">CAST</p>

      <div class="cast-list">
        <article class="cast-card" data-cast="sana">
          <div class="photo">
            <img src="../assets/CAST/sana.webp" alt="さな" loading="lazy" decoding="async">
          </div>
          <div class="cast-info">
            <h2>さな</h2>
            <p class="cast-catch">&nbsp;</p>
          </div>
        </article>

        <article class="cast-card" data-cast="nanami">
          <div class="photo">
            <img src="../assets/CAST/nanami.webp" alt="ななみ" loading="lazy" decoding="async">
          </div>
          <div class="cast-info">
            <h2>ななみ</h2>
            <p class="cast-catch">&nbsp;</p>
          </div>
        </article>

        <article class="cast-card" data-cast="kokoa">
          <div class="photo">
            <img src="../assets/CAST/kokoa.webp" alt="ここあ" loading="lazy" decoding="async">
          </div>
          <div class="cast-info">
            <h2>ここあ</h2>
            <p class="cast-catch">&nbsp;</p>
          </div>
        </article>

        <article class="cast-card" data-cast="rin">
          <div class="photo">
            <img src="../assets/CAST/rin.webp" alt="りん" loading="lazy" decoding="async">
          </div>
          <div class="cast-info">
            <h2>りん</h2>
            <p class="cast-catch">&nbsp;</p>
          </div>
        </article>
      </div>

      <p class="note">
        ※掲載内容は変更となる場合がございます。最新の在籍・出勤状況は<a class="contact-link" href="https://lin.ee/w4NzYLd" target="_blank" rel="noopener noreferrer">店舗LINE</a>またはスタッフまでご確認ください。
      </p>
    </section>

    <footer>
      © Jennys cafe
    </footer>
  </main>
</body>

</html>
